<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">

    <!-- Display screen: top line shows the earlier number + operator, bottom line shows the current number -->
    <div class="display">
      <div id="previous" class="previous"></div>
      <div id="current" class="current">0</div>
    </div>

    <!-- All the buttons live in one grid -->
    <div class="buttons" id="buttons">
      <button class="function span-2" data-action="clear">AC</button>
      <button class="function" data-action="delete">DEL</button>
      <button class="operator" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="−">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="span-2" data-number="0">0</button>
      <button data-number=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
